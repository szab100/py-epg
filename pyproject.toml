[tool.poetry]
name = "py-epg"
version = "0.5.3-b.8"
description = "py_epg is an easy to use, modular, multi-process EPG grabber written in Python."
authors = ["Szabolcs Fruhwald <mail@szab100.com>"]
keywords = ["xmltv", "epg"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/szab100/py-epg"
repository = "https://github.com/szab100/py-epg"
include = [
    "LICENSE.txt",
]

[tool.poetry.dependencies]
python = ">=3.9"
lxml = "*"
requests = "^2.32.0"
beautifulsoup4 = "^4.12.0"
fake-useragent = "^2.0.0"
python-dateutil = "^2.9.0"
PyYAML = "^6.0.2"
py-xmltv = "^1.0.8"
roman = "^5.0"
tqdm = "^4.67.0"
# py-xmltv models were generated for the 21.x xsdata API
xsdata = "^21.9"
pysocks = "^1.7.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.poetry.scripts]
epg = "py_epg.main:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
